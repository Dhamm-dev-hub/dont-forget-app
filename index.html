<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Candy Blast Infinity</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap');
*{box-sizing:border-box}body{margin:0;color:#5c246a;font-family:Fredoka,system-ui;background:radial-gradient(ellipse at 12% 7%,#fff7b6 0,transparent 30%),radial-gradient(ellipse at 90% 18%,#ffc2e9 0,transparent 34%),radial-gradient(ellipse at 55% 80%,#a5efff 0,transparent 38%),linear-gradient(160deg,#ffb9dd,#ffc7f2 35%,#a9eaff 75%,#b9f7d4);min-height:100vh;overflow-x:hidden}body:before{content:'🍬　　 ✦　　 🍭　　 ✦　　 🍬　　 ✦　　 🍭';position:fixed;inset:0;pointer-events:none;opacity:.08;font-size:38px;line-height:2.5;letter-spacing:20px;white-space:pre-wrap;transform:rotate(-12deg);background-image:radial-gradient(#fff 2px,transparent 2px);background-size:24px 24px}.wrap{max-width:500px;margin:auto;padding:13px 12px 25px;position:relative}.top{display:flex;align-items:center;justify-content:space-between}.logo{font-size:clamp(24px,7vw,34px);font-weight:700;line-height:.95;color:#fff;text-shadow:0 2px #ed58a9,0 4px #be3185,0 7px 12px #7d2c7755}.logo span{color:#fffc78}.sound{border:2px solid #fff;background:linear-gradient(#fff8,#ffb6e5);color:#9a2d7a;border-radius:16px;padding:8px 12px;font-size:20px;box-shadow:0 3px 0 #d85c9c}.panel{margin:12px 0;padding:10px 13px;border:3px solid #fff;border-radius:22px;background:linear-gradient(160deg,#fff8dc,#ffe5f4 55%,#d7f6ff);box-shadow:0 5px 0 #e68ac2,0 10px 18px #8e4a9950;color:#812b76}.stats{display:flex;justify-content:space-around;text-align:center}.stats small{display:block;font-size:11px;letter-spacing:1px;color:#bb4a9c;text-transform:uppercase;font-weight:700}.stats strong{font-size:25px;color:#742e96;text-shadow:0 1px #fff}.goal{display:flex;align-items:center;justify-content:center;gap:7px;margin-top:7px;font-size:14px;font-weight:600;color:#a33b88}.progress{height:11px;background:#f2b6de;border-radius:20px;overflow:hidden;margin-top:8px;border:2px solid #fff}.progress i{display:block;height:100%;width:0;background:linear-gradient(90deg,#ffe85d,#ff9a45,#ff63b9);border-radius:20px;transition:width .22s}.board-shell{padding:6px;border-radius:24px;background:linear-gradient(145deg,#fff,#ffb8e4 55%,#90e5ff);box-shadow:0 5px 0 #d56cb0,0 12px 22px #8c3f8750;border:3px solid #fff}.canvaswrap{border-radius:17px;overflow:hidden;background:#f6c5ed;touch-action:none}.canvaswrap canvas{display:block;width:100%;height:auto;touch-action:none}.buttons{display:flex;gap:8px;margin-top:12px}.btn{flex:1;border:2px solid #fff;border-radius:17px;padding:11px 6px;font:700 15px Fredoka;color:#fff;background:linear-gradient(#ff9cdb,#ed4ca8);box-shadow:0 4px 0 #c33186,0 6px 10px #9d4d8c44;cursor:pointer;text-shadow:0 1px #c42b7c}.btn.blue{background:linear-gradient(#9cf1ff,#40b9f4);box-shadow:0 4px 0 #2692ca,0 6px 10px #4d9cb944;text-shadow:0 1px #2286bb}.btn.gold{background:linear-gradient(#fff28e,#ffbb43);box-shadow:0 4px 0 #d38a23,0 6px 10px #b77b3244;color:#874a19;text-shadow:0 1px #fff}.btn:active{transform:translateY(2px)}.hint{text-align:center;font-size:13px;font-weight:600;color:#8e4287;margin:11px 0;text-shadow:0 1px #fff8}.toast{position:fixed;top:18%;left:50%;transform:translate(-50%,-10px);padding:10px 20px;background:linear-gradient(#fff,#ffe2f5);color:#a72f82;border:2px solid #fff;border-radius:30px;font-weight:700;font-size:20px;box-shadow:0 5px 0 #e482bd,0 6px 25px #9a438a55;opacity:0;pointer-events:none;z-index:5;transition:opacity .18s,transform .18s}.toast.show{opacity:1;transform:translate(-50%,0)}.modal{position:fixed;inset:0;background:#723a7a80;backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center;padding:20px;z-index:10}.modal.show{display:flex}.modalbox{max-width:340px;width:100%;text-align:center;padding:24px 20px;border:3px solid #fff;border-radius:27px;background:linear-gradient(145deg,#fff8d8,#ffc9ed 60%,#b9eaff);color:#853278;box-shadow:0 6px 0 #d87eb6,0 15px 50px #64327655}.modalbox h2{font-size:31px;margin:0 0 8px;color:#e246a3;text-shadow:0 1px #fff,0 2px #ffaddc}.modalbox p{font-size:17px;line-height:1.4}.modalbox button{width:100%;margin-top:8px}.settingrow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:9px 2px;border-bottom:1px solid #e7a7d4;font-size:15px}.settingrow label{flex:1}.settingrow input[type=range]{width:48%;accent-color:#e64da8}.settingrow input[type=number],.settingrow select{background:#fff9;border:1px solid #e7a7d4;border-radius:9px;color:#853278;padding:7px;font:600 14px Fredoka}.settingrow select option{color:#43215c}.toggle{width:auto!important;min-width:62px;margin:0!important;padding:7px 10px!important;background:linear-gradient(#fff,#ffd9ef)!important;color:#a32f7e!important;box-shadow:0 2px 0 #d780b7!important;border:1px solid #fff!important;border-radius:12px!important;font:700 13px Fredoka!important}.toggle.danger{background:#ffd4d4!important;color:#b53151!important}
</style></head><body><main class="wrap"><header class="top"><div class="logo">🍭 CANDY <span>BLAST</span><br><small style="font-size:13px;letter-spacing:3px">INFINITY</small></div><div style="display:flex;gap:7px"><button class="sound" id="sound">🔊</button><button class="sound" id="settingsBtn" aria-label="Settings">⚙️</button></div></header>
<section class="panel"><div class="stats"><div><small>Level</small><strong id="level">1</strong></div><div><small>Score</small><strong id="score">0</strong></div><div><small>Moves</small><strong id="moves">25</strong></div></div><div class="goal">🎯 Target <strong id="target">800</strong> · 🍬 <span>Score goal</span></div><div class="progress"><i id="progress"></i></div></section>
<div class="board-shell"><div class="canvaswrap"><canvas id="game" aria-label="Candy match game board"></canvas></div></div><div class="buttons"><button class="btn" id="shuffle">🔀 Shuffle</button><button class="btn blue" id="hint">💡 Hint</button><button class="btn gold" id="restart">↻ Restart</button></div><div class="hint">Tap two neighbors or swipe • Match 3+ candies ✨</div></main>
<div class="toast" id="toast"></div>
<div class="modal" id="settingsModal"><div class="modalbox" style="max-height:90vh;overflow:auto;text-align:left"><h2 style="text-align:center">⚙️ Game Settings</h2>
<div class="settingrow"><label>🎵 Background music</label><button class="toggle" id="musicToggle">OFF</button></div>
<div class="settingrow"><label>🔊 Sound effects</label><button class="toggle" id="sfxToggle">ON</button></div>
<div class="settingrow"><label>Music volume</label><input id="musicVol" type="range" min="0" max="100" value="20"></div>
<div class="settingrow"><label>Effects volume</label><input id="sfxVol" type="range" min="0" max="100" value="60"></div>
<div class="settingrow"><label>✨ Animation speed</label><select id="animSpeed"><option value="0.7">Fast</option><option value="1" selected>Normal</option><option value="1.35">Relaxed</option></select></div>
<div class="settingrow"><label>📳 Vibration</label><button class="toggle" id="vibeToggle">OFF</button></div>
<div class="settingrow"><label>🎮 Current level</label><input id="levelPick" type="number" min="1" max="999999" style="width:90px"></div>
<div class="settingrow"><label>🖥️ Fullscreen</label><button class="toggle" id="fullBtn">OPEN</button></div>
<div class="settingrow"><label>🗑️ Reset saved progress</label><button class="toggle danger" id="resetSave">RESET</button></div>
<button class="btn" id="closeSettings" style="width:100%;margin-top:12px">Save & Close ✓</button></div></div>
<div class="modal" id="modal"><div class="modalbox"><h2 id="mt">Sweet!</h2><p id="mp"></p><button class="btn" id="mb">Continue 🍬</button></div></div>
<script>
(()=>{'use strict';
const SIZE=8, TYPES=8, EMOJI=['🍓','🍋','🍇','🍊','🫐','🍏','🍬','🍒'], canvas=document.querySelector('#game'),ctx=canvas.getContext('2d',{alpha:false}),toast=document.querySelector('#toast');
let grid=[],level=1,score=0,moves=25,target=800,selected=-1,locked=false,soundOn=true,cell=0,boardPx=0,dpr=1,particles=[],animUntil=0,hoverHint=null,ctxAudio=null, settings={music:false,sfx:true,musicVol:20,sfxVol:60,anim:1,vibe:false};let musicOsc=null,musicGain=null,musicTimer=null;try{Object.assign(settings,JSON.parse(localStorage.getItem("candySettings")||"{}"))}catch{}
try{let s=JSON.parse(localStorage.getItem('candyInfinitySave')||'{}');level=Math.max(1,s.level||1);score=s.score||0}catch{}
const rand=()=>Math.floor(Math.random()*TYPES), wait=ms=>new Promise(r=>setTimeout(r,ms));
function targetFor(l){return Math.round(700+(l-1)*260+Math.pow(l,1.25)*70)}function movesFor(l){return Math.max(18,26-Math.floor(l/4))}
function save(){try{localStorage.setItem('candyInfinitySave',JSON.stringify({level,score}))}catch{}}
function sound(freq=520,dur=.08){if(!soundOn||!settings.sfx)return;try{if(!ctxAudio)ctxAudio=new(window.AudioContext||window.webkitAudioContext)();if(ctxAudio.state==='suspended')ctxAudio.resume();let o=ctxAudio.createOscillator(),g=ctxAudio.createGain();o.type='sine';o.frequency.setValueAtTime(freq,ctxAudio.currentTime);g.gain.setValueAtTime(.035*(settings.sfxVol/60),ctxAudio.currentTime);g.gain.exponentialRampToValueAtTime(.001,ctxAudio.currentTime+dur);o.connect(g);g.connect(ctxAudio.destination);o.start();o.stop(ctxAudio.currentTime+dur)}catch{}}
function resize(){let w=canvas.parentElement.clientWidth;dpr=Math.min(window.devicePixelRatio||1,1.5);canvas.width=Math.round(w*dpr);canvas.height=Math.round(w*dpr);canvas.style.width=w+'px';canvas.style.height=w+'px';ctx.setTransform(dpr,0,0,dpr,0,0);boardPx=w;cell=w/SIZE;draw()}
function findMatches(){let out=new Set();for(let r=0;r<SIZE;r++){let run=1;for(let c=1;c<SIZE;c++){if(grid[r*SIZE+c]===grid[r*SIZE+c-1])run++;else{if(run>=3)for(let k=c-run;k<c;k++)out.add(r*SIZE+k);run=1}}if(run>=3)for(let k=SIZE-run;k<SIZE;k++)out.add(r*SIZE+k)}for(let c=0;c<SIZE;c++){let run=1;for(let r=1;r<SIZE;r++){if(grid[r*SIZE+c]===grid[(r-1)*SIZE+c])run++;else{if(run>=3)for(let k=r-run;k<r;k++)out.add(k*SIZE+c);run=1}}if(run>=3)for(let k=SIZE-run;k<SIZE;k++)out.add(k*SIZE+c)}return out}
function newBoard(){grid=Array.from({length:SIZE*SIZE},rand);let m=findMatches();while(m.size){m.forEach(i=>grid[i]=rand());m=findMatches()}selected=-1;particles=[];draw()}
function drawCandy(x,y,t,scale=1,glow=false){let rad=cell*.39*scale;let cx=x+cell/2,cy=y+cell/2;ctx.save();ctx.translate(cx,cy);if(glow){ctx.shadowColor='#fff';ctx.shadowBlur=13}let colors=[['#ffb2d7','#ef2b7c','#b91360'],['#fff5a1','#ffc400','#d48b00'],['#d6a6ff','#8c38e9','#5720a8'],['#ffc89c','#ff7728','#c73b10'],['#9eeaff','#298ef4','#1551ad'],['#d4ffab','#70c72d','#39841a'],['#ffb4fa','#e440e2','#9e1ab1'],['#ffa8b0','#ff3d5d','#b91135']][t];let shape=t%4;ctx.beginPath();if(shape===0){ctx.arc(0,0,rad,0,Math.PI*2)}else if(shape===1){ctx.roundRect(-rad*.85,-rad*.85,rad*1.7,rad*1.7,rad*.35)}else if(shape===2){ctx.moveTo(0,-rad);ctx.bezierCurveTo(rad*.9,-rad*.7,rad*1.15,rad*.35,0,rad);ctx.bezierCurveTo(-rad*1.15,rad*.35,-rad*.9,-rad*.7,0,-rad)}else{ctx.moveTo(0,-rad);ctx.lineTo(rad*.85,0);ctx.lineTo(0,rad);ctx.lineTo(-rad*.85,0);ctx.closePath()}let g=ctx.createLinearGradient(-rad,-rad,rad,rad);g.addColorStop(0,colors[0]);g.addColorStop(.42,colors[1]);g.addColorStop(1,colors[2]);ctx.fillStyle=g;ctx.shadowColor='#24054188';ctx.shadowBlur=5;ctx.shadowOffsetY=3;ctx.fill();ctx.shadowBlur=0;ctx.shadowOffsetY=0;ctx.beginPath();ctx.ellipse(-rad*.32,-rad*.35,rad*.3,rad*.13,-.55,0,Math.PI*2);ctx.fillStyle='#ffffffaa';ctx.fill();ctx.beginPath();ctx.arc(rad*.28,rad*.3,rad*.12,0,Math.PI*2);ctx.fillStyle='#ffffff30';ctx.fill();ctx.restore()}
function draw(){if(!boardPx)return;ctx.clearRect(0,0,boardPx,boardPx);ctx.fillStyle='#f6c9ec';ctx.fillRect(0,0,boardPx,boardPx);for(let i=0;i<64;i++){let x=(i%8)*cell,y=Math.floor(i/8)*cell;ctx.fillStyle=(Math.floor(i/8+i%8)%2)?'#ffe5f7':'#f7d8ff';ctx.fillRect(x+1,y+1,cell-2,cell-2);ctx.strokeStyle='#ffffff70';ctx.lineWidth=1;ctx.strokeRect(x+2,y+2,cell-4,cell-4);if(selected===i){ctx.fillStyle='#fff7a955';ctx.fillRect(x+1,y+1,cell-2,cell-2);ctx.strokeStyle='#ffb83d';ctx.lineWidth=2.5;ctx.strokeRect(x+3,y+3,cell-6,cell-6)}if(hoverHint&&hoverHint.includes(i)){ctx.strokeStyle='#ffe86a';ctx.lineWidth=3;ctx.strokeRect(x+4,y+4,cell-8,cell-8)}if(grid[i]!=null)drawCandy(x,y,grid[i],1,selected===i)}particles.forEach(p=>{ctx.globalAlpha=Math.max(0,1-p.age/p.life);ctx.font=`${p.size}px Fredoka`;ctx.fillText(p.char,p.x+p.vx*p.age,p.y+p.vy*p.age);ctx.globalAlpha=1})}
function spawnParticles(i){let x=(i%8+.5)*cell,y=(Math.floor(i/8)+.5)*cell;for(let k=0;k<5;k++)particles.push({x,y,vx:(Math.random()-.5)*3,vy:-Math.random()*3-1,age:0,life:30+Math.random()*12,size:12+Math.random()*10,char:['✨','💖','⭐','🍬'][k%4]})}
function loop(){let active=particles.length>0;if(active){particles.forEach(p=>p.age++);particles=particles.filter(p=>p.age<p.life);draw()}requestAnimationFrame(loop)}requestAnimationFrame(loop);
function updateUI(){target=targetFor(level);document.querySelector('#level').textContent=level;document.querySelector('#score').textContent=score.toLocaleString();document.querySelector('#moves').textContent=moves;document.querySelector('#target').textContent=target.toLocaleString();document.querySelector('#progress').style.width=Math.min(100,score/target*100)+'%'}
function adjacent(a,b){return Math.abs(a-b)===8||(Math.floor(a/8)===Math.floor(b/8)&&Math.abs(a-b)===1)}
function posFromPointer(e){let rect=canvas.getBoundingClientRect();return {x:(e.clientX-rect.left)/rect.width*boardPx,y:(e.clientY-rect.top)/rect.height*boardPx}}
let pointerStart=null;
canvas.addEventListener('pointerdown',e=>{if(locked)return;e.preventDefault();canvas.setPointerCapture?.(e.pointerId);let p=posFromPointer(e),i=Math.floor(p.y/cell)*8+Math.floor(p.x/cell);if(i<0||i>=64)return;pointerStart={i,x:p.x,y:p.y};if(selected<0){selected=i;draw();sound(650,.04)}else if(selected===i){selected=-1;draw()}else if(adjacent(selected,i)){let a=selected;selected=-1;doSwap(a,i)}else{selected=i;draw();sound(400,.04)}});
canvas.addEventListener('pointerup',e=>{if(!pointerStart||locked)return;let p=posFromPointer(e),dx=p.x-pointerStart.x,dy=p.y-pointerStart.y;if(Math.hypot(dx,dy)>cell*.25){let a=pointerStart.i,rr=Math.round(dy/cell),cc=Math.round(dx/cell),b=a+rr*8+cc;if((Math.abs(rr)+Math.abs(cc))===1&&b>=0&&b<64&&adjacent(a,b)){selected=-1;doSwap(a,b)}}pointerStart=null});
async function doSwap(a,b){if(locked)return;locked=true;[grid[a],grid[b]]=[grid[b],grid[a]];draw();await wait(110*Number(settings.anim||1));let m=findMatches();if(!m.size){[grid[a],grid[b]]=[grid[b],grid[a]];draw();sound(210,.06);locked=false;return}moves--;await cascade(m,0);updateUI();locked=false;check();save()}
async function cascade(matches,chain){while(matches.size){matches.forEach(i=>spawnParticles(i));if(settings.vibe&&navigator.vibrate)navigator.vibrate(Math.min(80,matches.size*8));score+=matches.size*60*(chain+1);sound(420+chain*110,.1);draw();await wait(160*Number(settings.anim||1));matches.forEach(i=>grid[i]=null);for(let c=0;c<8;c++){let stack=[];for(let r=7;r>=0;r--){let v=grid[r*8+c];if(v!=null)stack.push(v)}for(let r=7;r>=0;r--)grid[r*8+c]=r>=8-stack.length?stack[7-r] : rand()}draw();await wait(90*Number(settings.anim||1));matches=findMatches();chain++;if(chain>10)break}updateUI()}
function check(){if(score>=target){showModal('🎉 Level Clear!',`Awesome! You cleared level ${level}.`,()=>{level++;score=Math.max(0,score-target);moves=movesFor(level);newBoard();updateUI();save()})}else if(moves<=0){showModal('😵 No moves left',`Score ${score} / ${target}. Try this level again.`,()=>{score=0;moves=movesFor(level);newBoard();updateUI();save()})}}
function showModal(title,msg,cb){document.querySelector('#mt').textContent=title;document.querySelector('#mp').textContent=msg;let m=document.querySelector('#modal');m.classList.add('show');document.querySelector('#mb').onclick=()=>{m.classList.remove('show');cb();sound(700,.12)}}
let toastT;function showToast(s){toast.textContent=s;toast.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>toast.classList.remove('show'),1000)}
function findMove(){for(let i=0;i<64;i++){let candidates=[i+1,i+8];for(let j of candidates){if(j>=64||(j===i+1&&i%8===7))continue;[grid[i],grid[j]]=[grid[j],grid[i]];let ok=findMatches().size;[grid[i],grid[j]]=[grid[j],grid[i]];if(ok)return [i,j]}}return null}
document.querySelector('#hint').onclick=()=>{if(locked)return;let m=findMove();if(m){hoverHint=m;draw();showToast('Try glowing tiles 💡');setTimeout(()=>{hoverHint=null;draw()},950)}else showToast('Shuffle board 🔀')};document.querySelector('#shuffle').onclick=()=>{if(locked)return;newBoard();showToast('Fresh candies! 🍭');sound(580,.09)};document.querySelector('#restart').onclick=()=>showModal('Restart level?','Current level score will reset.',()=>{score=0;moves=movesFor(level);newBoard();updateUI();save()});document.querySelector('#sound').onclick=()=>{soundOn=!soundOn;settings.sfx=soundOn;document.querySelector('#sound').textContent=soundOn?'🔊':'🔇';if(soundOn)sound(700,.08)};

function settingsSave(){try{localStorage.setItem('candySettings',JSON.stringify(settings))}catch{}}
function musicStart(){if(!settings.music||!ctxAudio)return;if(musicOsc)return;try{musicOsc=ctxAudio.createOscillator();musicGain=ctxAudio.createGain();musicOsc.type='sine';musicOsc.frequency.value=164.81;musicGain.gain.value=(settings.musicVol/100)*.025;musicOsc.connect(musicGain);musicGain.connect(ctxAudio.destination);musicOsc.start();musicTimer=setInterval(()=>{if(musicOsc){musicOsc.frequency.setTargetAtTime([164.81,196,220,246.94][Math.floor(Math.random()*4)],ctxAudio.currentTime,.5)}},1700)}catch{}}
function musicStop(){if(musicOsc){try{musicOsc.stop()}catch{}musicOsc.disconnect();musicOsc=null}if(musicTimer){clearInterval(musicTimer);musicTimer=null}}
function openSettings(){let sm=document.querySelector('#settingsModal');sm.classList.add('show');document.querySelector('#musicToggle').textContent=settings.music?'ON':'OFF';document.querySelector('#sfxToggle').textContent=settings.sfx?'ON':'OFF';document.querySelector('#vibeToggle').textContent=settings.vibe?'ON':'OFF';document.querySelector('#musicVol').value=settings.musicVol;document.querySelector('#sfxVol').value=settings.sfxVol;document.querySelector('#animSpeed').value=settings.anim;document.querySelector('#levelPick').value=level}
document.querySelector('#settingsBtn').onclick=openSettings;document.querySelector('#closeSettings').onclick=()=>{settingsSave();document.querySelector('#settingsModal').classList.remove('show');showToast('Settings saved ✓')};
document.querySelector('#musicToggle').onclick=()=>{settings.music=!settings.music;document.querySelector('#musicToggle').textContent=settings.music?'ON':'OFF';if(settings.music){if(!ctxAudio)ctxAudio=new(window.AudioContext||window.webkitAudioContext)();if(ctxAudio.state==='suspended')ctxAudio.resume();musicStart()}else musicStop()};
document.querySelector('#sfxToggle').onclick=()=>{settings.sfx=!settings.sfx;document.querySelector('#sfxToggle').textContent=settings.sfx?'ON':'OFF';sound(700,.07)};
document.querySelector('#vibeToggle').onclick=()=>{settings.vibe=!settings.vibe;document.querySelector('#vibeToggle').textContent=settings.vibe?'ON':'OFF';if(settings.vibe&&navigator.vibrate)navigator.vibrate(30)};
document.querySelector('#musicVol').oninput=e=>{settings.musicVol=+e.target.value;if(musicGain)musicGain.gain.setTargetAtTime(settings.musicVol/100*.025,ctxAudio.currentTime,.1)};
document.querySelector('#sfxVol').oninput=e=>settings.sfxVol=+e.target.value;document.querySelector('#animSpeed').onchange=e=>settings.anim=+e.target.value;
document.querySelector('#levelPick').onchange=e=>{let n=Math.max(1,Math.min(999999,parseInt(e.target.value)||1));if(n!==level){level=n;score=0;moves=movesFor(level);target=targetFor(level);newBoard();updateUI();save();showToast('Level set to '+level)}};
document.querySelector('#fullBtn').onclick=async()=>{try{if(!document.fullscreenElement)await document.documentElement.requestFullscreen();else await document.exitFullscreen()}catch{showToast('Fullscreen not supported')}};
document.querySelector('#resetSave').onclick=()=>{if(confirm('Reset saved level and score back to Level 1?')){level=1;score=0;moves=movesFor(1);newBoard();updateUI();save();document.querySelector('#levelPick').value=1;showToast('Progress reset')}};
window.addEventListener('resize',resize);moves=movesFor(level);newBoard();updateUI();resize();
})();
</script></body></html>
