<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Candy Blast Infinity</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap');
*{box-sizing:border-box}
:root{--pink:#ff62b9;--purple:#7c3aed;--blue:#4cc9f0;--gold:#ffcf43}
body{margin:0;min-height:100vh;font-family:Fredoka,system-ui,sans-serif;color:#fff;overflow-x:hidden;background:radial-gradient(ellipse at 20% 15%,#ff9fd5 0,transparent 36%),radial-gradient(ellipse at 85% 35%,#8e6cff 0,transparent 42%),linear-gradient(150deg,#28165e,#6d2aa9 55%,#35116a)}
body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.2;background-image:radial-gradient(#fff 1px,transparent 1px);background-size:27px 27px;animation:twinkle 5s infinite alternate}
@keyframes twinkle{from{opacity:.1}to{opacity:.3}}
.wrap{max-width:490px;margin:auto;padding:14px 13px 28px;position:relative}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.logo{font-size:clamp(22px,6vw,34px);font-weight:700;line-height:1;text-shadow:0 3px 0 #6d237f,0 6px 12px #250b45;letter-spacing:.3px}
.logo span{color:#ffef72}
.iconbtn{border:2px solid #ffffff66;background:#ffffff20;color:white;border-radius:14px;padding:9px 12px;font-size:20px;box-shadow:0 4px 0 #35155c;cursor:pointer}
.level-card{margin:12px 0 10px;padding:11px 14px;border:2px solid #ffffff55;border-radius:19px;background:linear-gradient(135deg,#ffffff2b,#ffffff10);box-shadow:0 7px 18px #1a073655,inset 0 1px #fff5}
.stats{display:flex;align-items:center;justify-content:space-between;gap:6px}
.stat{text-align:center;min-width:65px}
.stat small{display:block;font-size:11px;text-transform:uppercase;letter-spacing:1px;opacity:.8}
.stat strong{font-size:24px;text-shadow:0 2px 3px #4c177a}
.score{color:#fff3a4}
.goal{display:flex;align-items:center;gap:9px;justify-content:center;margin-top:8px;font-size:14px}
.goal .candymini{font-size:25px;filter:drop-shadow(0 2px 2px #0004)}
.progress{height:10px;background:#35135e88;border-radius:20px;overflow:hidden;margin-top:8px;border:1px solid #ffffff33}
.progress i{display:block;height:100%;width:0;background:linear-gradient(90deg,#ffe45d,#ff9c37,#ff68be);border-radius:20px;transition:width .4s}
.board-shell{padding:8px;border-radius:23px;background:linear-gradient(145deg,#ffffff4b,#ffffff14);box-shadow:0 10px 25px #1b064e66,inset 0 1px 0 #ffffff80;border:2px solid #ffffff55;position:relative}
.board{display:grid;grid-template-columns:repeat(8,1fr);gap:4px;aspect-ratio:1;background:#36145c70;padding:5px;border-radius:16px;touch-action:manipulation}
.cell{border:0;padding:0;display:flex;align-items:center;justify-content:center;border-radius:12px;background:linear-gradient(145deg,#ffffff26,#ffffff0c);position:relative;cursor:pointer;user-select:none;transition:transform .12s,filter .12s;min-width:0;overflow:visible}
.cell:active{transform:scale(.92)}
.cell.selected{transform:scale(1.08);outline:3px solid #fff;z-index:2;filter:brightness(1.2)}
.candy{font-size:clamp(23px,7.1vw,38px);line-height:1;filter:drop-shadow(0 3px 2px #23074470);animation:spawn .18s ease-out}
@keyframes spawn{from{transform:scale(.45) rotate(-25deg);opacity:0}to{transform:scale(1);opacity:1}}
.cell.pop{animation:pop .24s ease-in forwards}
@keyframes pop{50%{transform:scale(1.4);filter:brightness(1.8)}100%{transform:scale(.1);opacity:0}}
.cell.special:after{content:"✦";position:absolute;font-size:12px;right:2px;top:0;color:#fff;text-shadow:0 0 5px #fff}
.footer{display:flex;justify-content:space-between;gap:8px;margin-top:12px}
.action{flex:1;border:0;border-radius:15px;padding:11px 8px;font:600 15px Fredoka;color:#fff;background:linear-gradient(#ff83ce,#ef3eaa);box-shadow:0 5px 0 #a92c78,0 7px 13px #21073d66;cursor:pointer}
.action.blue{background:linear-gradient(#70e4ff,#2ca6ef);box-shadow:0 5px 0 #1470b4,0 7px 13px #21073d66}
.action.gold{background:linear-gradient(#ffe878,#ffad38);box-shadow:0 5px 0 #b76c1b,0 7px 13px #21073d66;color:#6a2c42}
.action:active{transform:translateY(3px);box-shadow:0 2px 0 #8b2471}
.hint{text-align:center;font-size:12px;opacity:.75;margin:10px 0}
.toast{position:fixed;top:20%;left:50%;transform:translate(-50%,-15px);padding:12px 22px;background:#fff;color:#8027a4;border-radius:30px;font-weight:700;font-size:21px;box-shadow:0 6px 25px #22054a88;opacity:0;pointer-events:none;z-index:20;transition:.25s}
.toast.show{opacity:1;transform:translate(-50%,0)}
.modal{position:fixed;inset:0;background:#16062bc9;display:none;align-items:center;justify-content:center;padding:20px;z-index:30}
.modal.show{display:flex}
.modalbox{max-width:340px;width:100%;text-align:center;padding:25px 20px;border:2px solid #fff8;border-radius:25px;background:linear-gradient(145deg,#ff8bd3,#9855ef 60%,#5c32b6);box-shadow:0 15px 50px #09001d}
.modalbox h2{font-size:32px;margin:0 0 8px;text-shadow:0 3px #78328c}
.modalbox p{font-size:17px;line-height:1.4}
.modalbox .action{margin-top:8px;width:100%}
.shake{animation:shake .28s}
@keyframes shake{25%{transform:translateX(-5px)}50%{transform:translateX(5px)}75%{transform:translateX(-3px)}}
.particle{position:fixed;pointer-events:none;z-index:10;font-size:18px;animation:particle .6s ease-out forwards}
@keyframes particle{to{transform:translate(var(--dx),var(--dy)) scale(.2) rotate(180deg);opacity:0}}
@media(min-width:500px){.candy{font-size:39px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><div class="logo">🍭 CANDY <span>BLAST</span><br><small style="font-size:13px;letter-spacing:3px">INFINITY</small></div><button class="iconbtn" id="soundBtn" title="Sound">🔊</button></div>
  <div class="level-card">
    <div class="stats">
      <div class="stat"><small>Level</small><strong id="level">1</strong></div>
      <div class="stat score"><small>Score</small><strong id="score">0</strong></div>
      <div class="stat"><small>Moves</small><strong id="moves">25</strong></div>
    </div>
    <div class="goal"><span>🎯 Target</span><strong id="target">800</strong><span class="candymini">🍬</span><span id="goalText">Reach the score!</span></div>
    <div class="progress"><i id="bar"></i></div>
  </div>
  <div class="board-shell"><div class="board" id="board"></div></div>
  <div class="footer"><button class="action" id="shuffle">🔀 Shuffle</button><button class="action blue" id="hint">💡 Hint</button><button class="action gold" id="restart">↻ Restart</button></div>
  <div class="hint">Swap candies • Match 3 or more • Make combos! ✨</div>
</div>
<div class="toast" id="toast"></div>
<div class="modal" id="modal"><div class="modalbox"><h2 id="modalTitle">Sweet!</h2><p id="modalMsg"></p><button class="action" id="modalBtn">Continue 🍬</button></div></div>
<script>
(()=>{
const N=8, TYPES=["🍓","🍋","🍇","🍊","🫐","🍏","🍬","🍒"];
const boardEl=document.getElementById("board"),toastEl=document.getElementById("toast");
let grid=[],level=1,score=0,moves=25,target=800,selected=null,busy=false,sound=true;
let saved={};try{saved=JSON.parse(localStorage.getItem("candyInfinitySave")||"{}")}catch(e){}
level=saved.level||1;score=saved.score||0;
const rand=()=>Math.floor(Math.random()*TYPES.length);
function targetFor(l){return Math.round(700+((l-1)*260)+Math.pow(l,1.25)*70)}
function movesFor(l){return Math.max(18,26-Math.floor(l/4))}
function save(){try{localStorage.setItem("candyInfinitySave",JSON.stringify({level,score,best:saved.best||0}))}catch(e){}}
function tone(freq=500,dur=.07,type="sine",vol=.045){if(!sound)return;try{let c=new(window.AudioContext||window.webkitAudioContext)(),o=c.createOscillator(),g=c.createGain();o.type=type;o.frequency.value=freq;g.gain.value=vol;g.gain.exponentialRampToValueAtTime(.001,c.currentTime+dur);o.connect(g);g.connect(c.destination);o.start();o.stop(c.currentTime+dur);o.onended=()=>c.close()}catch(e){}}
function render(){
 boardEl.innerHTML="";
 grid.forEach((v,i)=>{let b=document.createElement("button");b.className="cell"+(selected===i?" selected":"")+(v&&v.special?" special":"");b.setAttribute("aria-label",v?TYPES[v.t]:"empty");
 if(v){let s=document.createElement("span");s.className="candy";s.textContent=TYPES[v.t];b.appendChild(s)}
 b.addEventListener("click",()=>tap(i));boardEl.appendChild(b)});
 document.getElementById("level").textContent=level;document.getElementById("score").textContent=score.toLocaleString();document.getElementById("moves").textContent=moves;
 target=targetFor(level);document.getElementById("target").textContent=target.toLocaleString();
 document.getElementById("bar").style.width=Math.min(100,score/target*100)+"%";
}
function freshGrid(){grid=Array.from({length:N*N},()=>({t:rand()}));while(findMatches().size){findMatches().forEach(i=>grid[i]={t:rand()})}}
function findMatches(){
 let set=new Set();
 for(let r=0;r<N;r++){let run=1;for(let c=1;c<N;c++){let a=grid[r*N+c],b=grid[r*N+c-1];if(a&&b&&a.t===b.t)run++;else{if(run>=3)for(let k=c-run;k<c;k++)set.add(r*N+k);run=1}}if(run>=3)for(let k=N-run;k<N;k++)set.add(r*N+k)}
 for(let c=0;c<N;c++){let run=1;for(let r=1;r<N;r++){let a=grid[r*N+c],b=grid[(r-1)*N+c];if(a&&b&&a.t===b.t)run++;else{if(run>=3)for(let k=r-run;k<r;k++)set.add(k*N+c);run=1}}if(run>=3)for(let k=N-run;k<N;k++)set.add(k*N+c)}
 return set
}
function neighbors(a,b){return Math.abs(a-b)===N||(Math.floor(a/N)===Math.floor(b/N)&&Math.abs(a-b)===1)}
function tap(i){if(busy)return;if(selected===null){selected=i;render();tone(650,.035);return}
 if(selected===i){selected=null;render();return}
 if(!neighbors(selected,i)){selected=i;render();tone(420,.05);return}
 swap(selected,i);selected=null}
async function swap(a,b){
 busy=true;[grid[a],grid[b]]=[grid[b],grid[a]];render();
 await wait(120);
 let matches=findMatches();
 if(!matches.size){[grid[a],grid[b]]=[grid[b],grid[a]];render();busy=false;tone(220,.09,"triangle");return}
 moves--;await clearCascade(matches,0);
 render();busy=false;checkState();save()
}
const wait=ms=>new Promise(r=>setTimeout(r,ms));
async function clearCascade(matches,cascade){
 while(matches.size){
  const cells=[...matches];cells.forEach(i=>{let el=boardEl.children[i];if(el)el.classList.add("pop")});
  let points=cells.length*60*(cascade+1);score+=points;
  if(cascade>=1)showToast(["Sweet combo! ✨","Sugar rush! 💥","Amazing! 🌟"][Math.min(cascade-1,2)]);
  tone(420+cascade*110,.11,"sine",.055);
  cells.forEach(i=>particleAt(i));
  await wait(220);
  cells.forEach(i=>grid[i]=null);
  // gravity column by column
  for(let c=0;c<N;c++){let vals=[];for(let r=N-1;r>=0;r--){let v=grid[r*N+c];if(v)vals.push(v)}
   for(let r=N-1;r>=0;r--)grid[r*N+c]=r>=N-vals.length?vals[N-1-r]:{t:rand()}}
  render();await wait(130);
  matches=findMatches();cascade++;
 }
}
 function particleAt(i){let el=boardEl.children[i];if(!el)return;let rect=el.getBoundingClientRect();for(let k=0;k<4;k++){let p=document.createElement("span");p.className="particle";p.textContent=["✨","💖","⭐","🍬"][k];p.style.left=(rect.left+rect.width/2)+"px";p.style.top=(rect.top+rect.height/2)+"px";p.style.setProperty("--dx",(Math.random()*100-50)+"px");p.style.setProperty("--dy",(Math.random()*-100-20)+"px");document.body.appendChild(p);setTimeout(()=>p.remove(),650)}}
let toastTimer;function showToast(txt){toastEl.textContent=txt;toastEl.classList.add("show");clearTimeout(toastTimer);toastTimer=setTimeout(()=>toastEl.classList.remove("show"),1100)}
function checkState(){if(score>=target){modal("🎉 Level Complete!",`You reached ${score.toLocaleString()} points! Level ${level} cleared.`,()=>{level++;score=Math.max(0,score-target);moves=movesFor(level);target=targetFor(level);freshGrid();render();save()})}else if(moves<=0){modal("💔 Out of moves!",`Score ${score.toLocaleString()} / ${target.toLocaleString()}. Try again!`,()=>{score=0;moves=movesFor(level);freshGrid();render();save()})}}
function modal(title,msg,cb){document.getElementById("modalTitle").textContent=title;document.getElementById("modalMsg").textContent=msg;let m=document.getElementById("modal");m.classList.add("show");let btn=document.getElementById("modalBtn");btn.onclick=()=>{m.classList.remove("show");cb();tone(700,.13)}}
function validMove(){for(let i=0;i<N*N;i++){let j=i+1;if(i%N<N-1&&neighbors(i,j)){[grid[i],grid[j]]=[grid[j],grid[i]];let ok=findMatches().size>0;[grid[i],grid[j]]=[grid[j],grid[i]];if(ok)return [i,j]}
 j=i+N;if(j<N*N){[grid[i],grid[j]]=[grid[j],grid[i]];let ok=findMatches().size>0;[grid[i],grid[j]]=[grid[j],grid[i]];if(ok)return [i,j]}}
 return null}
document.getElementById("hint").onclick=()=>{if(busy)return;let m=validMove();if(m){selected=m[0];render();boardEl.children[m[1]].style.filter="brightness(1.6)";setTimeout(()=>{selected=null;render()},900);showToast("Try this move! 💡")}else showToast("Shuffle the board!")}
document.getElementById("shuffle").onclick=()=>{if(busy)return;freshGrid();selected=null;render();showToast("Fresh candies! 🍭");tone(600,.1)}
document.getElementById("restart").onclick=()=>modal("Restart level?","Your current score for this level will reset.",()=>{score=0;moves=movesFor(level);freshGrid();render();save()})
document.getElementById("soundBtn").onclick=()=>{sound=!sound;document.getElementById("soundBtn").textContent=sound?"🔊":"🔇";if(sound)tone(700,.08)}
moves=movesFor(level);freshGrid();render();
})();
</script>
</body></html>
