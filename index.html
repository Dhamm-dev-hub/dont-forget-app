<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Real Drive - Fixed</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#14221b;color:white;font-family:system-ui,Arial;touch-action:none}canvas{display:block;width:100%;height:100%}#hud{position:fixed;inset:0;pointer-events:none}.top{display:flex;justify-content:space-between;gap:8px;padding:10px}.glass{background:#08111bcc;border:1px solid #ffffff24;border-radius:13px;padding:9px 12px;backdrop-filter:blur(8px)}.brand{font-size:12px;font-weight:900;letter-spacing:1px}.speedbox{text-align:center;min-width:100px;font-weight:900;font-size:30px;line-height:1}.speedbox small{display:block;font-size:10px;letter-spacing:2px;color:#b8c9d7}.stats{font-size:11px;line-height:1.65;position:absolute;top:75px;left:10px}.bottom{position:absolute;bottom:12px;left:0;right:0;display:flex;justify-content:space-between;align-items:flex-end;padding:0 12px;gap:8px;pointer-events:auto}.controls{display:flex;gap:8px}.btn{border:1px solid #ffffff44;background:#122232cc;color:#fff;font-weight:bold;border-radius:16px;min-width:65px;height:65px;font-size:22px;touch-action:none;user-select:none}.btn:active,.btn.active{background:#1687c7aa}.pedal{height:78px;width:64px;font-size:12px}.gas{height:94px;background:#176f43aa}.brake{background:#9a3333aa}.overlay{position:fixed;inset:0;background:#08111dbb;display:flex;align-items:center;justify-content:center;padding:18px}.card{width:min(420px,95vw);padding:24px;text-align:center;border-radius:22px;background:#101d2bed;border:1px solid #ffffff24}.card h1{margin:0 0 8px}.card p{color:#bdcbd8;font-size:13px;line-height:1.5}.start{width:100%;border:0;border-radius:12px;padding:15px;background:#1ac2ed;color:#07141b;font-weight:900;font-size:16px}.hide{display:none}@media(orientation:portrait){.hint{font-size:11px}}
</style></head><body><canvas id="game"></canvas><div id="hud"><div class="top"><div class="brand glass">REAL DRIVE<br><small>LIGHTWEIGHT DRIVE SIM</small></div><div class="speedbox glass" id="speed">0<small>KM/H</small></div><button class="btn glass" style="height:44px;min-width:45px;font-size:17px" id="cam">CAM</button></div><div class="stats glass">DISTANCE <b id="dist">0.00 km</b><br>MODE <b id="mode">DAY</b></div><div class="bottom"><div class="controls"><button class="btn" id="left">◀</button><button class="btn" id="right">▶</button></div><div class="controls"><button class="btn pedal brake" id="brake">BRAKE<br>REV</button><button class="btn pedal gas" id="gas">GAS</button></div></div></div><div class="overlay" id="menu"><div class="card"><h1>REAL DRIVE</h1><p>Mobile-friendly driving game. No external libraries needed. Use steering, throttle and brake/reverse. Best in landscape.</p><button class="start" id="start">START DRIVE</button><p class="hint">Controls: arrows/WASD on keyboard or touch buttons.</p></div></div>
<script>
(()=>{
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');let W=0,H=0,dpr=1;function resize(){dpr=Math.min(devicePixelRatio||1,1.5);W=innerWidth;H=innerHeight;canvas.width=W*dpr;canvas.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)}addEventListener('resize',resize);resize();
const input={left:false,right:false,gas:false,brake:false};let started=false,speed=0,steer=0,offset=0,distance=0,cam=0,day=true,last=performance.now();const keys={ArrowLeft:'left',a:'left',ArrowRight:'right',d:'right',ArrowUp:'gas',w:'gas',ArrowDown:'brake',s:'brake'};addEventListener('keydown',e=>{if(keys[e.key]){input[keys[e.key]]=true;e.preventDefault()}});addEventListener('keyup',e=>{if(keys[e.key])input[keys[e.key]]=false});document.querySelectorAll('.btn').forEach(b=>{let id=b.id;if(!input.hasOwnProperty(id))return;const down=e=>{e.preventDefault();input[id]=true;b.classList.add('active');try{b.setPointerCapture(e.pointerId)}catch{}};const up=()=>{input[id]=false;b.classList.remove('active')};b.addEventListener('pointerdown',down);['pointerup','pointercancel','lostpointercapture'].forEach(ev=>b.addEventListener(ev,up))});document.getElementById('start').onclick=()=>{started=true;document.getElementById('menu').classList.add('hide')};document.getElementById('cam').onclick=()=>{cam=(cam+1)%2;};
function polygon(points,color){ctx.fillStyle=color;ctx.beginPath();ctx.moveTo(points[0][0],points[0][1]);for(let p of points.slice(1))ctx.lineTo(p[0],p[1]);ctx.closePath();ctx.fill()}
function road(){let horizon=H*.36;ctx.fillStyle=day?'#8fc5ed':'#172637';ctx.fillRect(0,0,W,horizon);ctx.fillStyle=day?'#3b7e36':'#142a1d';ctx.fillRect(0,horizon,W,H-horizon); // sun
ctx.fillStyle=day?'#fff1ad':'#d6e1ff';ctx.beginPath();ctx.arc(W*.78,H*.13,day?32:20,0,Math.PI*2);ctx.fill();
// perspective road segments
let curve=Math.sin(offset*.0008)*W*.08;let roadCenter=W/2+curve;let topWidth=W*.09,bottomWidth=W*.78;polygon([[roadCenter-topWidth,horizon],[roadCenter+topWidth,horizon],[W/2+bottomWidth/2,H],[W/2-bottomWidth/2,H]],'#34383d');
// shoulders and dashed lanes, perspective strips
for(let i=0;i<18;i++){let t=i/18, y=horizon+(H-horizon)*t*t, next=horizon+(H-horizon)*((i+1)/18)**2;let width=topWidth+(bottomWidth/2-topWidth)*t;let nw=topWidth+(bottomWidth/2-topWidth)*((i+1)/18);let stripe=((Math.floor(offset/28)+i)%2===0);polygon([[roadCenter-width-5,y],[roadCenter-width+2,y],[roadCenter-nw+2,next],[roadCenter-nw-5,next]],stripe?'#ddd':'#777');polygon([[roadCenter+width-2,y],[roadCenter+width+5,y],[roadCenter+nw+5,next],[roadCenter+nw-2,next]],stripe?'#ddd':'#777');if(stripe){for(let lane of [-1,1])polygon([[roadCenter+lane*width*.33-2,y],[roadCenter+lane*width*.33+2,y],[roadCenter+lane*nw*.33+2,next],[roadCenter+lane*nw*.33-2,next]],'#e8e5d9')}}
// scenery trees
for(let side of [-1,1])for(let i=0;i<10;i++){let t=((i/10+((offset/900)%1))%1),y=horizon+(H-horizon)*t*t,x=roadCenter+side*(topWidth+18+(bottomWidth/2-topWidth)*t)+side*30;let r=7+t*23;ctx.fillStyle='#4c3827';ctx.fillRect(x-r*.13,y-r*.1,r*.26,r*.75);ctx.fillStyle=day?'#245d2a':'#173d28';ctx.beginPath();ctx.arc(x,y-r*.4,r,0,Math.PI*2);ctx.fill();ctx.fillStyle=day?'#357b36':'#235638';ctx.beginPath();ctx.arc(x-r*.35,y-r*.65,r*.65,0,Math.PI*2);ctx.fill()}}
function drawCar(){let x=W/2+steer*W*.12,y=H*.78;ctx.save();ctx.translate(x,y);ctx.rotate(steer*.12); // shadow
ctx.fillStyle='#0006';ctx.beginPath();ctx.ellipse(0,22,43,18,0,0,Math.PI*2);ctx.fill();polygon([[-35,25],[-39,-20],[-28,-43],[28,-43],[39,-20],[35,25]],'#1768bd');polygon([[-26,-20],[-21,-36],[21,-36],[26,-20]],'#183b50');polygon([[-30,4],[-32,-15],[32,-15],[30,4]],'#277dd0');ctx.fillStyle='#e8f5ff';ctx.fillRect(-27,-23,9,5);ctx.fillRect(18,-23,9,5);ctx.fillStyle='#ef3434';ctx.fillRect(-27,17,8,5);ctx.fillRect(19,17,8,5);ctx.fillStyle='#101318';ctx.fillRect(-40,-20,8,17);ctx.fillRect(32,-20,8,17);ctx.fillRect(-40,12,8,17);ctx.fillRect(32,12,8,17);ctx.restore()}
function tick(now){let dt=Math.min((now-last)/1000,.04);last=now;if(started){if(input.gas)speed+=24*dt;else speed-=2.6*dt;if(input.brake){if(speed>1)speed-=42*dt;else speed-=14*dt}speed=Math.max(-25,Math.min(180,speed));let desired=(input.left?1:0)-(input.right?1:0);steer+=(desired-steer)*Math.min(1,dt*6);offset+=Math.max(-80,speed)*dt*20;distance+=Math.abs(speed)*dt/3600}road();drawCar();document.getElementById('speed').innerHTML=Math.round(Math.abs(speed))+'<small>KM/H</small>';document.getElementById('dist').textContent=distance.toFixed(2)+' km';document.getElementById('mode').textContent=day?'DAY':'NIGHT';requestAnimationFrame(tick)}requestAnimationFrame(tick);
})();
</script></body></html>
